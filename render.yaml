databases:
  - name: wyze-rto-db
    databaseName: wyze_rto
    user: wyze_rto_user
    plan: free

services:
  - type: web
    name: wyze-rto-attendance
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/olivialiuwyzettest/test2.git
    branch: codex/wbr-deck-agent
    autoDeploy: true
    healthCheckPath: /login
    buildCommand: corepack enable && corepack prepare pnpm@10.29.2 --activate && pnpm install --frozen-lockfile --prod=false && pnpm db:generate && pnpm build
    startCommand: pnpm db:deploy && pnpm start -- -p $PORT -H 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wyze-rto-db
          property: connectionString
      - key: APP_SHARED_ACCESS_CODE
        sync: false
      - key: APP_ALLOWED_EMAIL_DOMAINS
        value: wyze.com
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_DEFAULT_TIMEZONE
        value: America/Los_Angeles
      - key: APP_CRON_SECRET
        generateValue: true
      - key: BRIVO_MODE
        value: mock
      - key: BRIVO_WEBHOOK_MODE
        value: "false"
      - key: BRIVO_WEBHOOK_SECRET
        generateValue: true
      - key: BRIVO_ENTRY_EVENT_MARKERS
        value: OPEN,ACCESS_GRANTED,DOOR_OPEN,ACCESS-ALLOWED
      - key: BRIVO_AUTO_LINK_BY_EMAIL
        value: "false"
      - key: FRED_API_KEY
        sync: false
      - key: REIT_CRON_SECRET
        sync: false
      - key: REIT_TOP_N
        value: "12"
      - key: REIT_LIQUIDITY_FLOOR_USD
        value: "1500000"
      - key: REIT_STRESS_LOOKBACK_DAYS
        value: "1200"
      - key: REIT_UNIVERSE_SOURCE
        value: schh

  - type: cron
    name: reit-daily-refresh
    runtime: node
    plan: free
    region: oregon
    schedule: "5 13 * * *"
    repo: https://github.com/olivialiuwyzettest/test2.git
    branch: codex/wbr-deck-agent
    buildCommand: corepack enable && corepack prepare pnpm@10.29.2 --activate && pnpm install --frozen-lockfile --prod=false
    startCommand: >-
      node -e "const base=(process.env.REIT_DASHBOARD_URL||'').replace(/\\/$/,''); const secret=process.env.REIT_CRON_SECRET||''; if(!base){throw new Error('Missing REIT_DASHBOARD_URL');} fetch(base + '/api/cron/reit-refresh?secret=' + encodeURIComponent(secret)).then(async (res)=>{const body=await res.text(); if(!res.ok){throw new Error(body);} console.log(body);}).catch((err)=>{console.error(err); process.exit(1);});"
    envVars:
      - key: REIT_DASHBOARD_URL
        value: https://wyze-rto-attendance.onrender.com
      - key: REIT_CRON_SECRET
        sync: false
